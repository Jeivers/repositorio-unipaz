version: '3.8'

services:
  # 1. Frontend React Web (puerto 3000)
  frontend:
    build: ./frontend
    container_name: cdi_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:4000
    networks:
      - app_net

  # 2. Base de datos PostgreSQL (puerto 5432)
  db:
    image: postgres:15-alpine
    container_name: cdi_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cdi_unipaz
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_net

  # 3. Backend Node API (puerto 4000)
  backend:
    build: ./backend
    container_name: cdi_backend
    ports:
      - "4000:4000"
    environment:
      - DB_HOST=db
      - DB_USER=admin
      - DB_PASSWORD=password123
      - DB_NAME=cdi_unipaz
    depends_on:
      - db
    networks:
      - app_net

volumes:
  pg_data:

networks:
  app_net:
    driver: bridge